<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aivars Says</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #fdb320;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
  }

  /* Ground / platform */
  .stage {
    position: relative;
    width: 317px;
    height: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Dialogue balloon */
  .balloon {
    visibility: hidden;
    background: #fff;
    border: 4px solid #000;
    border-radius: 0;
    padding: 16px 20px;
    max-width: 300px;
    position: relative;
    image-rendering: pixelated;
    box-shadow: 4px 4px 0 #000;
    text-align: center;
    margin-bottom: 0;
    z-index: 10;
  }

  .balloon.visible {
    visibility: visible;
  }

  .balloon::after {
    content: '';
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 16px solid #000;
  }

  .balloon::before {
    content: '';
    position: absolute;
    bottom: -13px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 14px solid #fff;
    z-index: 1;
  }

  .balloon p {
    font-size: 11px;
    color: #000;
    line-height: 1.8;
    letter-spacing: 0.5px;
  }

  /* Sprite */
  .sprite-container {
    width: 317px;
    height: 512px;
    position: relative;
  }

  .sprite-container img {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* Retro scanline overlay */
  .scanlines {
    pointer-events: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0, 0, 0, 0.08) 2px,
      rgba(0, 0, 0, 0.08) 4px
    );
    z-index: 999;
  }

  /* Ground line */
  .ground {
    width: 340px;
    height: 6px;
    background: #e9c46a;
    border: 2px solid #000;
    margin-top: 2px;
    image-rendering: pixelated;
    box-shadow: 0 2px 0 #000;
  }
</style>
</head>
<body>

<div class="scanlines"></div>

<div class="stage">
  <div class="balloon" id="balloon">
    <p id="balloon-text"></p>
  </div>

  <div class="sprite-container">
    <img id="sprite" src="aivars-talking-01.png" alt="Aivars">
  </div>

  <div class="ground"></div>
</div>

<script>
  const FRAMES = [
    'aivars-talking-01.png',
    'aivars-talking-02.png',
    'aivars-talking-03.png',
    'aivars-talking-04.png'
  ];

  const PHRASES = [
    'I love Linkerd',
    'I love LinkedIn',
    'blamejose.com is the best blamejose website',
    'pieckapeika',
    'liet udeni',
    'I love kubernetes',
    'blamejose.lol is lame'
  ];

  const ANIM_DURATION  = 5000;   // ms — how long the animation plays
  const IDLE_DURATION  = 5000;   // ms — how long the character stays idle
  const FRAME_INTERVAL = 300;    // ms — time per frame

  const sprite      = document.getElementById('sprite');
  const balloon     = document.getElementById('balloon');
  const balloonText = document.getElementById('balloon-text');

  let frameIndex   = 0;
  let phraseIndex  = 0;
  let intervalId   = null;

  function startAnimation() {
    balloonText.textContent = PHRASES[phraseIndex % PHRASES.length];
    phraseIndex++;
    balloon.classList.add('visible');

    intervalId = setInterval(function () {
      frameIndex = (frameIndex + 1) % FRAMES.length;
      sprite.src = FRAMES[frameIndex];
    }, FRAME_INTERVAL);

    // Stop animation after ANIM_DURATION
    setTimeout(stopAnimation, ANIM_DURATION);
  }

  function stopAnimation() {
    clearInterval(intervalId);
    intervalId = null;

    balloon.classList.remove('visible');

    // Reset to first sprite
    frameIndex = 0;
    sprite.src = FRAMES[0];

    // After idle period, restart
    setTimeout(startAnimation, IDLE_DURATION);
  }

  // Kick off the first animation cycle
  startAnimation();
</script>

</body>
</html>
